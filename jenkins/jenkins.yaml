jenkins:
  systemMessage: "HeapHammer Multi-Version CI/CD Jenkins Controller"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 3
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true

unclassified:
  location:
    url: "http://localhost:8080/"


tool:
  jdk:
    installations:
      - name: "JDK21"
        home: "/opt/java/openjdk-21"
      - name: "JDK17"
        home: "/opt/java/openjdk-17"
      - name: "JDK8"
        home: "/opt/java/openjdk-8"

jobs:
  - script: >
      multibranchPipelineJob('HeapHammer') {
          displayName('HeapHammer Multi-Version Pipeline')
          description('Automated multi-version CI/CD build and regression test pipeline for HeapHammer.')
          branchSources {
              branchSource {
                  source {
                      git {
                          id('heaphammer-github')
                          remote('https://github.com/DurdeuVlad/heaphammer.git')
                          traits {
                              gitBranchDiscovery()
                              gitTagDiscovery()
                          }
                      }
                  }
                  strategy {
                      defaultBranchPropertyStrategy {
                          props {
                              // Standard default properties
                          }
                      }
                  }
              }
          }
          orphanedItemStrategy {
              discardOldItems {
                  numToKeep(20)
              }
          }
          factory {
              workflowBranchProjectFactory {
                  scriptPath('Jenkinsfile')
              }
          }
      }
