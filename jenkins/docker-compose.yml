services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: heaphammer-jenkins:latest
    container_name: jenkins-heaphammer
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx2g
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
    name: heaphammer_jenkins_home
