plugins {
	// Resolved but not applied until the version-range check below passes — the
	// sync workflow merges this directory into every ver/* branch, including
	// ones where NeoForge cannot exist.
	id 'net.neoforged.moddev' version "${mdg_version}" apply false
}

// Shared mod metadata is read from the root gradle.properties so this nested
// build can never diverge from the primary Fabric build's version/group/name.
// Command-line -P overrides (e.g. -Pmod_version=1.0.2 during release) win.
def rootProps = new Properties()
file('../../gradle.properties').withReader('UTF-8') { rootProps.load(it) }

version = project.findProperty('mod_version') ?: rootProps['mod_version']
group = project.findProperty('maven_group') ?: rootProps['maven_group']

// NeoForge only exists for Minecraft 1.20.2+ (1.20.1 transitional NeoForge uses
// the legacyforge plugin — see loaders/forge). When a branch sync lands this
// directory on an unsupported branch, degrade to a no-op instead of failing the
// whole branch pipeline.
def mcVersion = rootProps['minecraft_version'] ?: ''
def neoforgeSupported = (mcVersion ==~ /1\.20\.[2-9].*/)
		|| (mcVersion ==~ /1\.2[1-9]\..*/)
		|| (mcVersion ==~ /1\.[3-9][0-9]\..*/)
		|| (mcVersion ==~ /[2-9]\..*/)

if (!neoforgeSupported) {
	logger.lifecycle("NeoForge is not available for Minecraft ${mcVersion}; loaders/neoforge is a no-op on this branch.")
	// Register the lifecycle task names CI/release invoke so they succeed as no-ops.
	tasks.register('build')
	tasks.register('check')
	tasks.register('test')
	tasks.register('jar')
	tasks.register('assemble')
	return
}

apply plugin: 'net.neoforged.moddev'
apply plugin: 'maven-publish'

base.archivesName = project.findProperty('archives_base_name') ?: rootProps['archives_base_name']

neoForge {
	version = project.neoforge_version
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
	mavenCentral()
}

dependencies {
	// Both are provided by the Minecraft/NeoForge runtime classpath (strictly pinned
	// to gson 2.10.1 / slf4j 2.0.9 by minecraft-dependencies), so compile-only here.
	compileOnly "com.google.code.gson:gson:2.10.1"
	compileOnly "org.slf4j:slf4j-api:2.0.9"

	testImplementation "com.google.code.gson:gson:2.10.1"
	testImplementation "org.slf4j:slf4j-api:2.0.9"
	testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The shared source tree contains Fabric-specific code (entrypoint, mixins,
// platform/fabric) that must not be compiled into the NeoForge artifact.
// Loader-specific code with net.neoforged.* imports lives exclusively under
// loaders/neoforge/src — never in src/main/java.
sourceSets {
	main {
		java {
			// 'src/main/java' is already implied; add the repo-root shared tree.
			srcDir '../../src/main/java'
			exclude 'com/dwurdy/heaphammer/HeapHammer.java'
			exclude 'com/dwurdy/heaphammer/mixin/**'
			exclude 'com/dwurdy/heaphammer/platform/fabric/**'
		}
		resources {
			// 'src/main/resources' is already implied; add shared resources.
			srcDir '../../src/main/resources'
			exclude 'fabric.mod.json'
			exclude 'heaphammer.mixins.json'
		}
	}
	test {
		java {
			srcDir '../../src/test/java'
			exclude 'com/dwurdy/heaphammer/platform/fabric/**'
		}
	}
}

// Dependency ranges are derived from the branch's pins so a synced
// neoforge.mods.toml never declares a version floor for a different MC line.
def neoforgePin = project.findProperty('neoforge_version')?.toString()
def neoforgeMajorMinor = neoforgePin ? neoforgePin.tokenize('.').take(2).join('.') : neoforgePin

processResources {
	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': project.version,
				'mc_version_range': "[${mcVersion},)",
				'neoforge_version_range': "[${neoforgeMajorMinor},)"
	}
}

test {
	// Packaging tests inspect the assembled jar, so it must exist first.
	dependsOn tasks.named('jar')
	systemProperty "heaphammer.jar", tasks.named('jar').get().archiveFile.get().asFile.absolutePath
	useJUnitPlatform {
		excludeTags 'integration'
	}
}
