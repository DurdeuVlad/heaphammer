pluginManagement {
	repositories {
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Auto-provision the Java toolchain matching this branch's Minecraft version
	// (1.20.1 tools run on Java 17) even when only a newer JDK is installed.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'heaphammer-forge'
