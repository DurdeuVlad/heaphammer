pluginManagement {
	repositories {
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Auto-provision the Java toolchain even when only a newer JDK is installed.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'heaphammer-forge'
