# Forge loader build — independent Gradle project nested inside the version branch.
# Builds the shared src/ tree against MinecraftForge via ModDevGradle legacyforge.
# These pins are PER-BRANCH: the sync workflow preserves branch-local values.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# MinecraftForge version for this branch's Minecraft version (1.18.2)
forge_version=1.18.2-40.3.0
mdg_version=2.0.146
