plugins {
    id 'java-library'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            // Exclude modern Fabric-specific classes on Forge 1.12.2 branch
            exclude 'com/dwurdy/heaphammer/platform/fabric/**'
            exclude 'com/dwurdy/heaphammer/HeapHammer.java'
            exclude 'com/dwurdy/heaphammer/command/HeapHammerCommands.java'
            exclude 'com/dwurdy/heaphammer/mixin/**'
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
            // Exclude Fabric-specific tests
            exclude 'com/dwurdy/heaphammer/ModMatrixVerificationTest.java'
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "org.slf4j:slf4j-api:2.0.13"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// Stub task for Jenkins pipeline compatibility across version branches
task buildTestmods {
    description = 'Stub task for testmod packaging on Forge 1.12.2 branch'
}

