plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
	// Essential repositories are automatically handled by Fabric Loom.
	// Additional dependency repositories can be declared here if needed.
	mavenCentral()
}

loom {
	def mcVer = project.minecraft_version
	def supportsSplit = mcVer.startsWith("1.18") || mcVer.startsWith("1.19") || mcVer.startsWith("1.20") || mcVer.startsWith("1.21")
	if (supportsSplit) {
		splitEnvironmentSourceSets()
	}

	mods {
		"heaphammer" {
			sourceSet sourceSets.main
			if (supportsSplit) {
				sourceSet sourceSets.client
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.google.code.gson:gson:2.11.0"
	implementation "org.slf4j:slf4j-api:2.0.13"

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

task adversarialServerTest(type: Test) {
	group = "verification"
	description = "Runs adversarial live-server integration tests against a real Minecraft dedicated server."
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	testLogging {
		showStandardStreams = true
		events "passed", "skipped", "failed", "standardOut", "standardError"
	}
}


sourceSets {
	testmodChunkcache {
		java.srcDirs = ['testmods/leak-chunkcache/src/main/java']
		resources.srcDirs = ['testmods/leak-chunkcache/src/main/resources']
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	testmodOmnitrack {
		java.srcDirs = ['testmods/leak-omnitrack/src/main/java']
		resources.srcDirs = ['testmods/leak-omnitrack/src/main/resources']
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
	testmodCrossmodCore {
		java.srcDirs = ['testmods/crossmod-core/src/main/java']
		resources.srcDirs = ['testmods/crossmod-core/src/main/resources']
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	testmodCrossmodConsumer {
		java.srcDirs = ['testmods/crossmod-consumer/src/main/java']
		resources.srcDirs = ['testmods/crossmod-consumer/src/main/resources']
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.testmodCrossmodCore.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.testmodCrossmodCore.output
	}
}

task jarChunkcache(type: Jar) {
	archiveBaseName = 'testmod-leak-chunkcache'
	archiveVersion = '1.0.0'
	destinationDirectory = file("build/testmods")
	from sourceSets.testmodChunkcache.output
}

task jarOmnitrack(type: Jar) {
	archiveBaseName = 'testmod-leak-omnitrack'
	archiveVersion = '1.0.0'
	destinationDirectory = file("build/testmods")
	from sourceSets.testmodOmnitrack.output
}

task jarCrossmodCore(type: Jar) {
	archiveBaseName = 'testmod-crossmod-core'
	archiveVersion = '1.0.0'
	destinationDirectory = file("build/testmods")
	from sourceSets.testmodCrossmodCore.output
}

task jarCrossmodConsumer(type: Jar) {
	archiveBaseName = 'testmod-crossmod-consumer'
	archiveVersion = '1.0.0'
	destinationDirectory = file("build/testmods")
	from sourceSets.testmodCrossmodConsumer.output
}

task buildTestmods(dependsOn: [jarChunkcache, jarOmnitrack, jarCrossmodCore, jarCrossmodConsumer]) {
	group = "build"
	description = "Compiles and packages all synthetic testmod jars for empirical verification"
}

// These advanced fixtures use the stable modern Fabric API surface shared by
// the 1.20.1+ Fabric targets. Keep them out of older Fabric and Forge builds
// until loader-specific adaptations exist.
def advancedFabricMinecraftVersions = ['1.21.4', '1.21.1', '1.20.6', '1.20.4', '1.20.1']
if (advancedFabricMinecraftVersions.contains(project.minecraft_version)) {
	sourceSets {
		testmodPlayerSession {
			java.srcDirs = ['testmods/leak-playersession/src/main/java']
			resources.srcDirs = ['testmods/leak-playersession/src/main/resources']
			compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
			runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
		}
		testmodPersistentEntity {
			java.srcDirs = ['testmods/leak-persistententity/src/main/java']
			resources.srcDirs = ['testmods/leak-persistententity/src/main/resources']
			compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
			runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
		}
		testmodCloneCache {
			java.srcDirs = ['testmods/leak-clonecache/src/main/java']
			resources.srcDirs = ['testmods/leak-clonecache/src/main/resources']
			compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
			runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
		}
		testmodFakePlayerFactory {
			java.srcDirs = ['testmods/leak-fakeplayerfactory/src/main/java']
			resources.srcDirs = ['testmods/leak-fakeplayerfactory/src/main/resources']
			compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
			runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
		}
		testmodGazeTrack {
			java.srcDirs = ['testmods/leak-gazetrack/src/main/java']
			resources.srcDirs = ['testmods/leak-gazetrack/src/main/resources']
			compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
			runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
		}
		testmodCacheList {
			java.srcDirs = ['testmods/leak-cachelist/src/main/java']
			resources.srcDirs = ['testmods/leak-cachelist/src/main/resources']
			compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
			runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
		}
		testmodAntagOptimizer {
			java.srcDirs = ['testmods/antag-optimizer/src/main/java']
			resources.srcDirs = ['testmods/antag-optimizer/src/main/resources']
			compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.testmodCacheList.output
			runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.testmodCacheList.output
		}
	}

	task jarPlayerSession(type: Jar) {
		archiveBaseName = 'testmod-leak-playersession'
		archiveVersion = '1.0.0'
		destinationDirectory = file("build/testmods")
		from sourceSets.testmodPlayerSession.output
	}

	task jarPersistentEntity(type: Jar) {
		archiveBaseName = 'testmod-leak-persistententity'
		archiveVersion = '1.0.0'
		destinationDirectory = file("build/testmods")
		from sourceSets.testmodPersistentEntity.output
	}

	task jarCloneCache(type: Jar) {
		archiveBaseName = 'testmod-leak-clonecache'
		archiveVersion = '1.0.0'
		destinationDirectory = file("build/testmods")
		from sourceSets.testmodCloneCache.output
	}

	task jarFakePlayerFactory(type: Jar) {
		archiveBaseName = 'testmod-leak-fakeplayerfactory'
		archiveVersion = '1.0.0'
		destinationDirectory = file("build/testmods")
		from sourceSets.testmodFakePlayerFactory.output
	}

	task jarGazeTrack(type: Jar) {
		archiveBaseName = 'testmod-leak-gazetrack'
		archiveVersion = '1.0.0'
		destinationDirectory = file("build/testmods")
		from sourceSets.testmodGazeTrack.output
	}

	task jarCacheList(type: Jar) {
		archiveBaseName = 'testmod-leak-cachelist'
		archiveVersion = '1.0.0'
		destinationDirectory = file("build/testmods")
		from sourceSets.testmodCacheList.output
	}

	task jarAntagOptimizer(type: Jar) {
		archiveBaseName = 'testmod-antag-optimizer'
		archiveVersion = '1.0.0'
		destinationDirectory = file("build/testmods")
		from sourceSets.testmodAntagOptimizer.output
	}

	buildTestmods.dependsOn(jarPlayerSession, jarPersistentEntity, jarCloneCache,
			jarFakePlayerFactory, jarGazeTrack, jarCacheList, jarAntagOptimizer)
	tasks.named('test') {
		dependsOn(buildTestmods)
	}
} else {
	// Keep unsupported historical branches free of a false packaging failure.
	tasks.withType(Test).configureEach {
		exclude '**/AdvancedLeakFixtureBuildTest.class'
	}
}

def targetJavaVersion = project.hasProperty('java_version') ? Integer.parseInt(project.property('java_version').toString()) : 21

// Keep every Fabric testmod manifest aligned with the branch that built it.
// Custom source sets have their own ProcessResources tasks, so configure the
// whole task type instead of only the main source set's task.
tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
	def currentVersion = project.version
	def currentMinecraftVersion = project.minecraft_version
	def currentLoaderVersion = project.loader_version
	def currentJavaVersion = project.hasProperty('java_version') ? project.property('java_version').toString() : '21'
	inputs.properties(
		version: currentVersion,
		minecraft_version: currentMinecraftVersion,
		fabric_loader_version: currentLoaderVersion,
		java_version: currentJavaVersion
	)

	filesMatching("fabric.mod.json") {
		expand(
			version: currentVersion,
			minecraft_version: currentMinecraftVersion,
			fabric_loader_version: currentLoaderVersion,
			java_version: currentJavaVersion
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = targetJavaVersion
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Target publishing repositories can be configured here
	}
}
