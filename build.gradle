plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
}

minecraft {
    mcVersion.set('1.12.2')

    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')

    username.set('Developer')

    extraRunJvmArguments.addAll(['-ea:' + project.maven_group])
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

// Compile Java 17 syntax (records, var, etc.) down to Java 8 bytecode using Jabel
compileJava {
    sourceCompatibility = 17
    options.release = 8
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            // Exclude modern Fabric-specific classes on Forge 1.12.2 branch
            exclude 'com/dwurdy/heaphammer/platform/fabric/**'
            exclude 'com/dwurdy/heaphammer/HeapHammer.java'
            exclude 'com/dwurdy/heaphammer/command/HeapHammerCommands.java'
            exclude 'com/dwurdy/heaphammer/command/CommandPermissions.java'
            exclude 'com/dwurdy/heaphammer/mixin/**'
            exclude 'com/dwurdy/heaphammer/diagnostics/JfrTrigger.java'
        }
        resources {
            srcDirs = ['src/main/resources']
            // Exclude Fabric-specific resources
            exclude 'fabric.mod.json'
            exclude 'heaphammer.mixins.json'
            exclude 'heaphammer.client.mixins.json'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
            exclude 'com/dwurdy/heaphammer/ModMatrixVerificationTest.java'
            exclude 'com/dwurdy/heaphammer/command/CommandPermissionsTest.java'
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "org.slf4j:slf4j-api:2.0.13"

    // Jabel: compile Java 17 syntax to Java 8 bytecode
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:0.4.2'
    compileOnly('com.github.bsideup.jabel:jabel-javac-plugin:0.4.2') {
        transitive = false
    }

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

processResources {
    inputs.property "mod_version", project.mod_version

    filesMatching("mcmod.info") {
        expand "mod_version": project.mod_version
    }
}

// Stub task for Jenkins pipeline compatibility across version branches
task buildTestmods {
    description = 'Stub task for testmod packaging on Forge 1.12.2 branch'
}
