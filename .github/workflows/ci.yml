name: CI

on:
  push:
    branches:
      - master
      - 'ver/**'
  pull_request:
    branches:
      - master
      - 'ver/**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile and Run Unit Tests
        run: ./gradlew check test --no-daemon

      - name: Build Mod & Synthetic Testmod Jars
        run: ./gradlew build buildTestmods --no-daemon

      - name: Build & Test Nested Loader JARs
        run: |
          for d in loaders/*/; do
            if [ -f "${d}settings.gradle" ]; then
              echo "=== Nested loader build: ${d} ==="
              (cd "$d" && ../../gradlew build --no-daemon)
            fi
          done

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
