name: CI

on:
  push:
    branches:
      - master
      - 'release/**'
      - 'ver/**'
  pull_request:
    branches:
      - master
      - 'release/**'
      - 'ver/**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Target Java Version
        id: java_target
        run: |
          TARGET_JAVA=$(grep '^java_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "version=${TARGET_JAVA:-21}" >> $GITHUB_OUTPUT
          echo "Target Java version: ${TARGET_JAVA:-21}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java_target.outputs.version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile and Run Unit Tests
        run: ./gradlew check test --no-daemon

      - name: Build Mod & Synthetic Testmod Jars
        run: ./gradlew build buildTestmods --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
