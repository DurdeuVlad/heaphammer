name: Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # Required for GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.mc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical 6 supported versions from docs/PUBLICATION.md §2
          - branch: master
            mc-version: '1.21.1'
            java-version: '21'
            artifact-name: heaphammer-1.21.1
          - branch: ver/1.20.1
            mc-version: '1.20.1'
            java-version: '21'
            artifact-name: heaphammer-1.20.1
          - branch: ver/1.18.2
            mc-version: '1.18.2'
            java-version: '21'
            artifact-name: heaphammer-1.18.2
          - branch: ver/1.16.5
            mc-version: '1.16.5'
            java-version: '21'
            artifact-name: heaphammer-1.16.5
          - branch: ver/1.12.2-forge
            mc-version: '1.12.2'
            java-version: '17'
            artifact-name: heaphammer-1.12.2
          - branch: ver/1.7.10-forge
            mc-version: '1.7.10'
            java-version: '17'
            artifact-name: heaphammer-1.7.10
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read mod version
        id: modver
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "version=${MOD_VERSION:-1.0.0}" >> $GITHUB_OUTPUT

      - name: Build mod JAR
        run: ./gradlew build -x test --no-daemon

      - name: Stage & rename JAR with MC version
        run: |
          mkdir -p staging
          MOD_VERSION="${{ steps.modver.outputs.version }}"
          MC_VERSION="${{ matrix.mc-version }}"
          # Find the primary (non-sources, non-dev) JAR
          JAR=$(find build/libs -name "heaphammer-*.jar" ! -name "*sources*" ! -name "*dev*" | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: No primary JAR found in build/libs/"
            ls -la build/libs/
            exit 1
          fi
          cp "$JAR" "staging/heaphammer-${MC_VERSION}-${MOD_VERSION}.jar"
          echo "Staged: heaphammer-${MC_VERSION}-${MOD_VERSION}.jar"
          ls -la staging/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: staging/*.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to GitHub, Modrinth & CurseForge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          # Strip leading 'v' for the bare version number
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}, version: ${VERSION}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/production
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist/production
          sha256sum *.jar > SHA256SUMS.txt
          echo "Checksums generated:"
          cat SHA256SUMS.txt

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from ${PREV_TAG} to ${TAG}..."
            git log --pretty=format:"- %s" "${PREV_TAG}..${TAG}" > CHANGELOG.md
          else
            echo "No previous tag found. Generating full changelog..."
            git log --pretty=format:"- %s" HEAD > CHANGELOG.md
          fi
          # Prepend header
          {
            echo "# HeapHammer ${TAG}"
            echo ""
            echo "**Deterministic Minecraft server stress testing and retained-memory regression detection.**"
            echo ""
            echo "### Supported Minecraft Versions"
            echo ""
            echo "| Minecraft Version | Loader | Release Binary |"
            echo "|---|---|---|"
            echo "| **1.21.1** | Fabric | \`heaphammer-1.21.1-${{ steps.release.outputs.version }}.jar\` |"
            echo "| **1.20.1** | Fabric & Forge | \`heaphammer-1.20.1-${{ steps.release.outputs.version }}.jar\` |"
            echo "| **1.18.2** | Fabric & Forge | \`heaphammer-1.18.2-${{ steps.release.outputs.version }}.jar\` |"
            echo "| **1.16.5** | Forge & Fabric | \`heaphammer-1.16.5-${{ steps.release.outputs.version }}.jar\` |"
            echo "| **1.12.2** | Forge | \`heaphammer-1.12.2-${{ steps.release.outputs.version }}.jar\` |"
            echo "| **1.7.10** | Forge | \`heaphammer-1.7.10-${{ steps.release.outputs.version }}.jar\` |"
            echo ""
            echo "### Changes"
            echo ""
            cat CHANGELOG.md
            echo ""
            echo ""
            echo "### Checksums (SHA-256)"
            echo ""
            echo '```'
            cat dist/production/SHA256SUMS.txt
            echo '```'
          } > RELEASE_NOTES.md
          echo "Changelog generated ($(wc -l < RELEASE_NOTES.md) lines)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          echo "Creating GitHub Release ${TAG}..."
          gh release create "${TAG}" \
            dist/production/*.jar \
            dist/production/SHA256SUMS.txt \
            --title "HeapHammer ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

      - name: Publish Fabric JARs to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth
          modrinth-id: heaphammer
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-unfeature-mode: subset

          # CurseForge
          curseforge-id: '1687734'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # GitHub (links the release created above)
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Release metadata
          name: HeapHammer ${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          version-type: release
          changelog-file: RELEASE_NOTES.md

          # Fabric JARs (auto-detected from fabric.mod.json)
          files: |
            dist/production/heaphammer-1.21*.jar
            dist/production/heaphammer-1.20*.jar
            dist/production/heaphammer-1.18*.jar
            dist/production/heaphammer-1.16*.jar

      - name: Publish Forge JARs to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth
          modrinth-id: heaphammer
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          modrinth-unfeature-mode: subset

          # CurseForge
          curseforge-id: '1687734'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # GitHub (links the release created above)
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Release metadata
          name: HeapHammer ${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}-forge
          version-type: release
          changelog-file: RELEASE_NOTES.md

          # Forge JARs — explicit loader specification
          files: |
            dist/production/heaphammer-1.12*.jar
            dist/production/heaphammer-1.7*.jar
          loaders: forge

      - name: Summary
        run: |
          echo "## Release ${{ steps.release.outputs.tag }} Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published to GitHub Releases, Modrinth (heaphammer), and CurseForge (1687734)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          ls -1 dist/production/*.jar | sed 's|.*/|`|;s|$`|' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
